<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my Art Studio</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #reset-btn {
            position: absolute; bottom: 24px; right: 24px; padding: 10px 18px;
            background: rgba(0, 0, 0, 0.75); color: #fff; border: none;
            border-radius: 8px; cursor: pointer; font-size: 14px; display: none; z-index: 10;
        }
        #reset-btn:hover { background: rgba(0, 0, 0, 0.95); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/meshoptimizer@0.18.1/meshopt_decoder.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>
    <button id="reset-btn">back</button>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffcc);
        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        const initCamPos = new THREE.Vector3(0, 2, 5), initTarget = new THREE.Vector3();
        camera.position.copy(initCamPos);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        dirLight.position.set(5, 8, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.bias = -0.0001;
        scene.add(new THREE.AmbientLight(0xffffff, 0.7), dirLight, new THREE.DirectionalLight(0xffffff, 0.3));
        const dracoLoader = new THREE.DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        const loader = new THREE.GLTFLoader().setDRACOLoader(dracoLoader).setMeshoptDecoder(MeshoptDecoder);
        let studioModel;
        loader.load('https://chaliptul.github.io/apinutchaya_w.github.io/myartstudioclt.glb', (gltf) => {
            studioModel = gltf.scene;
            studioModel.traverse(c => { 
                if (c.isMesh) {
                    c.castShadow = c.receiveShadow = true;
                } 
            });
            scene.add(studioModel);
        }, undefined, console.error);

        const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
        const resetBtn = document.getElementById('reset-btn');
        const tweenCam = (targetPos, targetLook, duration, showBtn) => {
            new TWEEN.Tween(camera.position).to(targetPos, duration).easing(TWEEN.Easing.Cubic.Out).start();
            new TWEEN.Tween(controls.target).to(targetLook, duration).easing(TWEEN.Easing.Cubic.Out).start();
            resetBtn.style.display = showBtn ? 'block' : 'none';
        };
        const clickableNames = [
            'Plane004', 'Plane.004',
            'Plane005', 'Plane.005',
            'Plane006', 'Plane.006',
            'Plane007', 'Plane.007',
            'Plane008', 'Plane.008',
            'Plane012', 'Plane.012',
            'Plane013', 'Plane.013',
            'Plane015', 'Plane.015',
            'Plane016', 'Plane.016',
            'Plane021', 'Plane.021',
            'Plane022', 'Plane.022',
            'Plane023', 'Plane.023',
            'Plane024', 'Plane.024'
        ];
        function getClickableObject(hitMesh) {
            let obj = hitMesh;
            while (obj && obj !== studioModel) {
                const name = obj.name || obj.userData?.name || '';
                if (clickableNames.includes(name)) return { object: obj, name: name };
                obj = obj.parent;
            }
            return null;
        }
        window.addEventListener('click', (e) => {
            if (e.target === resetBtn || !studioModel) return;
            mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(studioModel.children, true);
            if (intersects.length) {
                const target = getClickableObject(intersects[0].object);
                if (target) {
                    const center = new THREE.Box3().setFromObject(target.object).getCenter(new THREE.Vector3());
                    let targetCamPos = new THREE.Vector3();

                    if (['Plane004', 'Plane.004', 'Plane006', 'Plane.006'].includes(target.name)) {
                        targetCamPos.set(center.x, center.y + 1.2, center.z + 0.3);
                    }
                    else if (['Plane005', 'Plane.005', 'Plane015', 'Plane.015'].includes(target.name)) {
                        targetCamPos.set(center.x + 1.1, center.y, center.z + 0.2);
                    } 
                    else if (['Plane016', 'Plane.016'].includes(target.name)) {
                        targetCamPos.set(center.x, center.y + 0.1, center.z + 0.9);
                    }
                    else if (['Plane007', 'Plane.007', 'Plane008', 'Plane.008'].includes(target.name)) {
                        targetCamPos.set(center.x, center.y, center.z + 0.85);
                    }
                    else {
                        targetCamPos.set(center.x, center.y, center.z + 0.8);
                    }
                    tweenCam(targetCamPos, center, 1200, true);
                }
            }
        });
        window.addEventListener('mousemove', (e) => {
            if (!studioModel) return;
            mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(studioModel.children, true);
            let isHovered = false;
            if (intersects.length) {
                const target = getClickableObject(intersects[0].object);
                if (target) isHovered = true;
            }
            
            document.body.style.cursor = isHovered ? 'pointer' : 'default';
        });
        resetBtn.addEventListener('click', () => tweenCam(initCamPos, initTarget, 1000, false));
        (function animate(t) {
            requestAnimationFrame(animate);
            TWEEN.update(t);
            controls.update();
            renderer.render(scene, camera);
        })();
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>

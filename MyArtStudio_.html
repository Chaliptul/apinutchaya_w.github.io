<!DOCTYPE html>
<html>
<head>
    <title>ArtStudio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffcc);
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        directionalLight.position.set(5, 8, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.bias = -0.0001;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const defaultTarget = new THREE.Vector3(0, 0, 0);
        const defaultCamPos = new THREE.Vector3(0, 2, 5);
        const targetTarget = defaultTarget.clone();
        const targetCamPos = defaultCamPos.clone();

        const pickables = []; 
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        loader.load('https://chaliptul.github.io/apinutchaya_w.github.io/myartstudioo.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    pickables.push(child); // เพิ่ม mesh ลงในรายการที่คลิกได้
                }
            });
            model.position.set(0, 0, 0);
            scene.add(model);
        }, undefined, (error) => {
            console.error('An error happened while loading the model:', error);
        });
        renderer.domElement.addEventListener('pointerdown', onPick);
        function onPick(e) {
            const r = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
            pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(pickables, true);
            if (intersects.length > 0) {
                const hitObject = intersects[0].object;
                const hitPoint = intersects[0].point;
                targetTarget.copy(hitPoint);
                
                const offset = camera.position.clone().sub(controls.target).normalize().multiplyScalar(1.8);
                targetCamPos.copy(hitPoint).add(offset);
            } else {
                targetTarget.copy(defaultTarget);
                targetCamPos.copy(defaultCamPos);
            }
        }

        function animate() {
            controls.target.lerp(targetTarget, 0.05);
            camera.position.lerp(targetCamPos, 0.05);
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

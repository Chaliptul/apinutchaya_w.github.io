<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Apinutchaya's Painting</title>

    <style>
        body {margin: 0;padding: 0;box-sizing: border-box;font-family: "Segoe UI", sans-serif; background: #F5F1EB;}
        .container {display: flex;height: 100vh;  }
        .sidebar {width: 180px;background: #6F4E37;color: white;display: flex;flex-direction: column;gap: 12px;padding: 18px;box-shadow: 3px 0 10px rgba(0, 0, 0, .2);}
        .sidebar h2 {text-align: center;color: #FFF8F2;}
        .tool {background: #A67C52;border: none;color: white;padding: 12px;font-size: 16px;border-radius: 10px;cursor: pointer;transition: .2s;}
        .tool:hover {background: #8B5E3C; transform: translateX(4px); }
        .main {flex: 1; display: flex; flex-direction: column;}
        .topbar {display: flex;align-items: center;gap: 20px;padding: 15px;background: white;border-bottom: 1px solid #ddd;}

        canvas {margin: auto;background: white;border: 3px solid #C7B299;box-shadow: 0 10px 25px rgba(0, 0, 0, .15);}
        label {font-weight: bold;color: #6F4E37;}
        input[type="color"] {width: 50px;height: 40px;border: none;}
        input[type="range"] {width: 130px;}
    </style>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <h2>⋆.˚𝕄𝕪ℙ𝕒𝕚𝕟𝕥𝕚𝕟𝕘⋆.˚</h2>
            <button class="tool" onclick="tool='pencil'">✎ ℙ𝕖𝕟𝕔𝕚𝕝</button>
            <button class="tool" onclick="tool='line'">╱ 𝕃𝕚𝕟𝕖</button>
            <button class="tool" onclick="tool='rect'">▭ ℝ𝕖𝕔𝕥𝕒𝕟𝕘𝕝𝕖</button>
            <button class="tool" onclick="tool='circle'">◯ ℂ𝕚𝕣𝕔𝕝𝕖</button>
            <button class="tool" onclick="tool='eraser'">⌦ 𝔼𝕣𝕒𝕤𝕖𝕣</button>
            <button class="tool" onclick="clearCanvas()">🗑 ℂ𝕝𝕖𝕒𝕣</button>
        </div>

        <div class="main">
            <div class="topbar">
                <label>𓍢ִ໋🀦𓂃🖌 ℂ𝕠𝕝𝕠𝕣</label>
                <input type="color" id="color" value="#000000">
                <label>🖍 𝕊𝕚𝕫𝕖</label>
                <input type="range" id="size" min="1" max="30" value="3">
            </div>
            <canvas id="canvas" width="1000" height="650"></canvas>
        </div>
    </div>

    <script>

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let tool = "pencil";
        let drawing = false;
        let startX, startY;
        let snapshot;

        canvas.addEventListener("mousedown", startDraw);
        canvas.addEventListener("mousemove", draw);
        canvas.addEventListener("mouseup", stopDraw);

        function getPos(event) {const rect = canvas.getBoundingClientRect();
            return {
                x: event.clientX - rect.left,
                y: event.clientY - rect.top
            };
        }

        function startDraw(event) {drawing = true;
            const pos = getPos(event);startX = pos.x;startY = pos.y;
            ctx.strokeStyle = document.getElementById("color").value;
            ctx.lineWidth = document.getElementById("size").value;
            ctx.lineCap = "round";

            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (tool === "pencil" || tool === "eraser") {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
            }
        }

        function draw(event) {
            if (!drawing) return;
            const pos = getPos(event);
            ctx.lineWidth = document.getElementById("size").value;

            if (tool === "pencil") {
                ctx.strokeStyle = document.getElementById("color").value;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (tool === "eraser") {
                ctx.strokeStyle = "white";
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else {
                ctx.putImageData(snapshot, 0, 0);
                ctx.strokeStyle = document.getElementById("color").value;
                if (tool === "line") {
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                } else if (tool === "rect") {
                    ctx.strokeRect(
                        startX,
                        startY,
                        pos.x - startX,
                        pos.y - startY
                    );
                } else if (tool === "circle") {
                    const rx = (pos.x - startX) / 2;
                    const ry = (pos.y - startY) / 2;
                    const centerX = startX + rx;
                    const centerY = startY + ry;

                    ctx.beginPath();
                    ctx.ellipse(
                        centerX,
                        centerY,
                        Math.abs(rx),
                        Math.abs(ry),
                        0,
                        0,
                        Math.PI * 2
                    );
                    ctx.stroke();
                }
            }
        }
        function stopDraw() {drawing = false;}
        function clearCanvas() {ctx.clearRect(0, 0, canvas.width, canvas.height);}
    </script>
</body>
</html>
